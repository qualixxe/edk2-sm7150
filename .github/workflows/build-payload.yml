name: Build UEFI payload (PE32+ .efi)

# Builds a standalone AArch64 EFI application.
#
# Why: on courbet the bootloader reports (bootloader) kernel:uefi, and the
# partition list contains abl / uefisecapp / uefivarstore, i.e. the firmware
# chain is Qualcomm EDK2. EDK2 hands the boot kernel to LoadImage, which only
# accepts a PE/COFF image. The FD produced by build.sh is a firmware volume
# (not a PE) and gzipped, so it can never be LoadImage'd - that is the leading
# hypothesis for the hang.
#
# This build produces the reference PE payload so the transport can be proven
# before sm7150Pkg is wired into it.

on:
  push:
    branches: [main]
    paths:
      - 'sm7150Pkg/**'
      - 'build-*.sh'
      - '.github/workflows/build-payload.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            uuid-dev \
            iasl \
            nasm \
            git \
            python3 \
            python3-setuptools \
            zip \
            unzip

      - name: Build BaseTools
        run: |
          set -e
          export PACKAGES_PATH="$PWD/Common/edk2:$PWD"
          export WORKSPACE="$PWD/workspace"
          mkdir -p "$WORKSPACE"
          . Common/edk2/edksetup.sh
          make -C Common/edk2/BaseTools -j"$(nproc)"

      - name: Build UefiPayloadPkg (AARCH64 RELEASE)
        run: |
          set -e
          export PACKAGES_PATH="$PWD/Common/edk2:$PWD"
          export WORKSPACE="$PWD/workspace"
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          . Common/edk2/edksetup.sh
          build -s -n "$(nproc)" -a AARCH64 -t GCC5 \
                -b RELEASE \
                -p UefiPayloadPkg/UefiPayloadPkg.dsc \
                -D BOOT_MANAGER_ESCAPE=TRUE \
                -D BOOTSPLASH_IMAGE=FALSE \
                -D PLATFORM_BOOT_TIMEOUT=10

      - name: Collect and validate
        run: |
          set -e
          EFI="$(find workspace/Build -name 'UefiPayloadPkg.efi' -type f | head -1)"
          if [ -z "$EFI" ]; then
            echo "::error::UefiPayloadPkg.efi was not produced"
            find workspace/Build -name '*.efi' | head -20 || true
            exit 1
          fi

          mkdir -p out
          cp -v "$EFI" out/UefiPayloadPkg.efi

          echo ""
          echo "=== PE/COFF header ==="
          python3 - <<'PY'
          import struct
          d = open("out/UefiPayloadPkg.efi","rb").read()
          off = struct.unpack_from("<I", d, 0x3C)[0]
          mach = struct.unpack_from("<H", d, off+4)[0]
          opt  = struct.unpack_from("<H", d, off+24)[0]
          sub  = struct.unpack_from("<H", d, off+92)[0]
          print(f"size     : {len(d)} bytes")
          print(f"machine  : 0x{mach:04x} (expect 0xaa64 = AArch64)")
          print(f"opt magic: 0x{opt:04x} (expect 0x20b = PE32+)")
          print(f"subsystem: {sub} (expect 10 = EFI_APPLICATION)")
          assert mach == 0xaa64, "not AArch64"
          assert opt  == 0x20b,  "not PE32+"
          assert sub  == 10,     "not an EFI application"
          print("PE validation OK")
          PY
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uefi-payload
          path: out/
          if-no-files-found: error
          retention-days: 30
