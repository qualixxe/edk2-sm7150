name: Build UEFI (edk2-sm7150 / courbet)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run is pointless work; stop it when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04 = Python 3.10. Newer distros dropped distutils, which BaseTools
    # still relies on, so the runner version is deliberate.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Common/edk2 is a submodule and is what build_common.sh actually
          # builds against. actions/checkout pins it to the commit recorded in
          # the tree, which keeps builds reproducible.
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            uuid-dev \
            iasl \
            nasm \
            git \
            python3 \
            python3-setuptools \
            zip \
            unzip \
            abootimg \
            mkbootimg

      - name: Verify toolchain
        run: |
          set -e
          aarch64-linux-gnu-gcc --version | head -1
          python3 --version
          iasl -v 2>&1 | head -2
          mkbootimg --help >/dev/null 2>&1 || echo "warning: mkbootimg has no --help, continuing"

      - name: Build BaseTools
        run: |
          set -e
          chmod +x firstrun.sh build.sh build_common.sh clean.sh
          ./firstrun.sh

      - name: Build firmware (RELEASE + DEBUG)
        run: |
          set -e
          mkdir -p out

          # --- RELEASE: the firmware we actually want -----------------------
          ./build.sh RELEASE
          cp -v boot-courbet-release.img out/
          cp -v uefi-release.img out/
          cp -v workspace/Build/courbet/RELEASE_GCC5/FV/SM7150_UEFI.fd out/SM7150_UEFI-release.fd

          # --- DEBUG: same firmware, but prints its log onto the screen -----
          # Used only to see how far the boot gets. Not fatal if it does not
          # fit into the 2 MB FD, so keep going and still upload RELEASE.
          if ./build.sh DEBUG; then
            cp -v boot-courbet-debug.img out/
            cp -v uefi-debug.img out/
            cp -v workspace/Build/courbet/DEBUG_GCC5/FV/SM7150_UEFI.fd out/SM7150_UEFI-debug.fd
          else
            echo "::warning::DEBUG build failed (see log above); RELEASE artifacts are still uploaded"
          fi

          echo ""
          echo "=== artifacts ==="
          ls -la out
          echo ""
          echo "=== boot-courbet-release.img header (expect ANDROID! magic) ==="
          # od is coreutils; xxd comes from vim-common and is not guaranteed.
          head -c 8 out/boot-courbet-release.img | od -c

      - name: Build bootable courbet image
        run: |
          set -e
          mkdir -p out

          # This is the image that is actually known to boot on courbet.
          #
          # build.sh produces a kernel the bootloader rejects: it gzips a plain
          # EFI firmware volume, which has no ARM64 image magic at offset 0x38.
          # The bootloader inflates the kernel and looks for that magic, then
          # hands over. A bootable image instead carries a prebuilt
          # "MBN header || ARM64 image" payload with the board DTB appended
          # after the compressed stream.
          #
          # The firmware comes from payloads/, the DTB is this repository's own
          # qcom-courbet.dtb. See payloads/README.md for the full rationale.
          python3 sm7150Pkg/tools/make_courbet_image.py \
            --payload payloads/sm7150-uefi-surya-payload.gz \
            --dtb     qcom-courbet.dtb \
            --out     out/xiaomi-courbet.img

          # Padded to the full boot partition (fastboot: 0x8000000), ready to
          # write with `fastboot flash boot`.
          python3 sm7150Pkg/tools/make_courbet_image.py \
            --payload payloads/sm7150-uefi-surya-payload.gz \
            --dtb     qcom-courbet.dtb \
            --out     out/xiaomi-courbet-128m.img \
            --pad-to-partition

      - name: Validate bootable image
        run: |
          set -e
          python3 - <<'PY'
          import struct, sys, zlib
          p = "out/xiaomi-courbet.img"
          d = open(p, "rb").read()
          assert d[:8] == b"ANDROID!", "not an Android boot image"
          ks = struct.unpack_from("<I", d, 8)[0]
          page = struct.unpack_from("<I", d, 36)[0]
          hv = struct.unpack_from("<I", d, 40)[0]
          kernel = d[page:page+ks]
          o = zlib.decompressobj(16 + zlib.MAX_WBITS)
          inflated = o.decompress(kernel); o.flush()
          dtb = kernel[len(kernel)-len(o.unused_data):]

          print(f"image       : {p}  {len(d)} bytes")
          print(f"header      : version={hv} page={page}")
          print(f"kernel      : {ks} bytes")
          print(f"  ARM64 magic at 0x38 : {inflated[0x38:0x3c]!r}")
          assert inflated[0x38:0x3c] == b"ARM\x64", "no ARM64 image magic - loader will reject"
          assert b"_FVH" in inflated, "no EFI firmware volume in the payload"
          print(f"  _FVH at   : 0x{inflated.find(b'_FVH'):x}")
          print(f"dtb         : {len(dtb)} bytes, magic {dtb[:4].hex()}")
          assert dtb[:4] == b"\xd0\x0d\xfe\xed", "device tree missing"
          assert struct.unpack_from(">I", dtb, 4)[0] == len(dtb), "DTB totalsize mismatch"
          print("validation OK")
          PY
          echo ""
          echo "=== artifacts ==="
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uefi-courbet
          path: out/
          # 'error' is the point: a failed build must not look successful.
          if-no-files-found: error
          retention-days: 30
