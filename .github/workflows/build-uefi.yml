name: Build UEFI (edk2-sm7150 / courbet)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run is pointless work; stop it when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04 = Python 3.10. Newer distros dropped distutils, which BaseTools
    # still relies on, so the runner version is deliberate.
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Common/edk2 is a submodule and is what build_common.sh actually
          # builds against. actions/checkout pins it to the commit recorded in
          # the tree, which keeps builds reproducible.
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            uuid-dev \
            iasl \
            nasm \
            git \
            python3 \
            python3-setuptools \
            zip \
            unzip \
            abootimg \
            mkbootimg

      - name: Verify toolchain
        run: |
          set -e
          aarch64-linux-gnu-gcc --version | head -1
          python3 --version
          iasl -v 2>&1 | head -2
          mkbootimg --help >/dev/null 2>&1 || echo "warning: mkbootimg has no --help, continuing"

      - name: Build BaseTools
        run: |
          set -e
          chmod +x firstrun.sh build.sh build_common.sh clean.sh
          ./firstrun.sh

      - name: Build firmware (RELEASE + DEBUG)
        run: |
          set -e
          mkdir -p out

          # --- RELEASE: the firmware we actually want -----------------------
          ./build.sh RELEASE
          cp -v boot-courbet-release.img out/
          cp -v uefi-release.img out/
          cp -v workspace/Build/courbet/RELEASE_GCC5/FV/SM7150_UEFI.fd out/SM7150_UEFI-release.fd

          # --- DEBUG: same firmware, but prints its log onto the screen -----
          # Used only to see how far the boot gets. Not fatal if it does not
          # fit into the 2 MB FD, so keep going and still upload RELEASE.
          if ./build.sh DEBUG; then
            cp -v boot-courbet-debug.img out/
            cp -v uefi-debug.img out/
            cp -v workspace/Build/courbet/DEBUG_GCC5/FV/SM7150_UEFI.fd out/SM7150_UEFI-debug.fd
          else
            echo "::warning::DEBUG build failed (see log above); RELEASE artifacts are still uploaded"
          fi

          echo ""
          echo "=== artifacts ==="
          ls -la out
          echo ""
          echo "=== boot-courbet-release.img header (expect ANDROID! magic) ==="
          # od is coreutils; xxd comes from vim-common and is not guaranteed.
          head -c 8 out/boot-courbet-release.img | od -c

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uefi-courbet
          path: out/
          # 'error' is the point: a failed build must not look successful.
          if-no-files-found: error
          retention-days: 30
